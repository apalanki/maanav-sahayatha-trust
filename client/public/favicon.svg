<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Based on the MST logo: a blue hand reaching down to an orange hand rising like a flame,
       above the blue swoosh. Colors sampled from client/public/logo.png. -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>

  <!-- Orange hand / flame (rising up) -->
  <path d="M30 50 C15 46 9 33 17 20 C18 29 22 34 28 35 C25 25 29 17 35 12 C35 23 48 28 47 39 C46 46 39 50 30 50 Z" fill="#F17D00"/>

  <!-- Blue hand (reaching down) -->
  <path d="M41 5 C52 12 52 27 41 35 C32 27 31 13 41 5 Z" fill="#2D65AF"/>

  <!-- Blue swoosh -->
  <path d="M7 58 C21 51 42 50 57 54" fill="none" stroke="#2D65AF" stroke-width="5.5" stroke-linecap="round"/>
</svg>
